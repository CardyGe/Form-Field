<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000"><canvas id="out" width="1920" height="1080" style="width:100vw;height:100vh"></canvas>
<script>
const W = 1920, H = 1080, N = 8, SW = 480, SH = 270, FRAMES = 600;
const quiet = s => new Promise(r => setTimeout(r, s));
// Stand-ins for instruments: eight WebGL canvases, each drawing a moving full-screen pattern every frame.
const VS = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p * .5 + .5; gl_Position = vec4(p, 0, 1); }`;
function program(gl, fs) {
  const make = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; };
  const p = gl.createProgram(); gl.attachShader(p, make(gl.VERTEX_SHADER, VS)); gl.attachShader(p, make(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(p, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  return p;
}
const sources = Array.from({ length: N }, (_, i) => {
  const c = document.createElement('canvas'); c.width = SW; c.height = SH;
  const gl = c.getContext('webgl2');
  const p = program(gl, `#version 300 es
precision highp float; in vec2 uv; out vec4 o; uniform float t;
void main(){ float v = sin(uv.x*40.+t*3.+${i}.)*sin(uv.y*25.-t*2.); o = vec4(.5+.5*v, uv.x, uv.y, 1); }`);
  gl.useProgram(p);
  return { c, gl, t: gl.getUniformLocation(p, 't') };
});
// The 2D stage, as the compositor draws today.
const stage = document.createElement('canvas'); stage.width = W; stage.height = H;
const ctx = stage.getContext('2d');
// The warp helper: one WebGL2 context, a texture per picture, drawn through a 3x3 perspective transform.
const warp = document.createElement('canvas'); warp.width = 960; warp.height = 540;
const wgl = warp.getContext('webgl2', { premultipliedAlpha: true, alpha: true });
const wp = program(wgl, `#version 300 es
precision highp float; in vec2 uv; out vec4 o; uniform sampler2D tex; uniform mat3 inv;
void main(){ vec3 q = inv * vec3(uv, 1.); vec2 s = q.xy / q.z; if (s.x<0.||s.y<0.||s.x>1.||s.y>1.) { o = vec4(0); return; } o = texture(tex, s); }`);
wgl.useProgram(wp);
const texs = sources.map(() => { const t = wgl.createTexture(); wgl.bindTexture(wgl.TEXTURE_2D, t); for (const [k, v] of [[wgl.TEXTURE_MIN_FILTER, wgl.LINEAR], [wgl.TEXTURE_MAG_FILTER, wgl.LINEAR], [wgl.TEXTURE_WRAP_S, wgl.CLAMP_TO_EDGE], [wgl.TEXTURE_WRAP_T, wgl.CLAMP_TO_EDGE]]) wgl.texParameteri(wgl.TEXTURE_2D, k, v); return t; });
const inv = wgl.getUniformLocation(wp, 'inv');
// A gentle trapezoid inverse (any valid matrix costs the same).
const INV = new Float32Array([1.1, 0, 0, .05, 1, .1, -.05, 0, 1]);
// The visible stage-corner pass: the 2D stage uploaded and drawn through the corners onto the window's canvas.
const out = document.getElementById('out');
const ogl = out.getContext('webgl2');
const op = program(ogl, `#version 300 es
precision highp float; in vec2 uv; out vec4 o; uniform sampler2D tex; uniform mat3 inv;
void main(){ vec3 q = inv * vec3(uv, 1.); vec2 s = q.xy / q.z; o = (s.x<0.||s.y<0.||s.x>1.||s.y>1.) ? vec4(0,0,0,1) : texture(tex, vec2(s.x, 1.-s.y)); }`);
ogl.useProgram(op);
const otex = ogl.createTexture(); ogl.bindTexture(ogl.TEXTURE_2D, otex); ogl.texParameteri(ogl.TEXTURE_2D, ogl.TEXTURE_MIN_FILTER, ogl.LINEAR); ogl.texParameteri(ogl.TEXTURE_2D, ogl.TEXTURE_WRAP_S, ogl.CLAMP_TO_EDGE); ogl.texParameteri(ogl.TEXTURE_2D, ogl.TEXTURE_WRAP_T, ogl.CLAMP_TO_EDGE);
ogl.uniformMatrix3fv(ogl.getUniformLocation(op, 'inv'), false, new Float32Array([1.02, 0, 0, .01, 1.02, .01, -.01, -.01, 1]));
const sync = gl => { const px = new Uint8Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); };
const box = i => ({ x: (i % 4) * 480, y: Math.floor(i / 4) * 540, w: 470, h: 530 });

// For gl-only: textures of the sources in the visible context, drawn straight to it through each shape's transform.
const op2 = program(ogl, `#version 300 es
precision highp float; in vec2 uv; out vec4 o; uniform sampler2D tex; uniform mat3 inv;
void main(){ vec3 q = inv * vec3(uv, 1.); vec2 s = q.xy / q.z; if (s.x<0.||s.y<0.||s.x>1.||s.y>1.) discard; o = texture(tex, s); }`);
const otexs = sources.map(() => { const t = ogl.createTexture(); ogl.bindTexture(ogl.TEXTURE_2D, t); ogl.texParameteri(ogl.TEXTURE_2D, ogl.TEXTURE_MIN_FILTER, ogl.LINEAR); ogl.texParameteri(ogl.TEXTURE_2D, ogl.TEXTURE_WRAP_S, ogl.CLAMP_TO_EDGE); ogl.texParameteri(ogl.TEXTURE_2D, ogl.TEXTURE_WRAP_T, ogl.CLAMP_TO_EDGE); return t; });
const inv2 = ogl.getUniformLocation(op2, 'inv');
const bigWarp = document.createElement('canvas'); bigWarp.width = W; bigWarp.height = H;
const bgl = bigWarp.getContext('webgl2', { premultipliedAlpha: true });
const bp = program(bgl, `#version 300 es
precision highp float; in vec2 uv; out vec4 o; uniform sampler2D tex; uniform mat3 inv;
void main(){ vec3 q = inv * vec3(uv, 1.); vec2 s = q.xy / q.z; if (s.x<0.||s.y<0.||s.x>1.||s.y>1.) discard; o = texture(tex, s); }`);
bgl.useProgram(bp);
const btexs = sources.map(() => { const t = bgl.createTexture(); bgl.bindTexture(bgl.TEXTURE_2D, t); bgl.texParameteri(bgl.TEXTURE_2D, bgl.TEXTURE_MIN_FILTER, bgl.LINEAR); bgl.texParameteri(bgl.TEXTURE_2D, bgl.TEXTURE_WRAP_S, bgl.CLAMP_TO_EDGE); bgl.texParameteri(bgl.TEXTURE_2D, bgl.TEXTURE_WRAP_T, bgl.CLAMP_TO_EDGE); return t; });
const binv = bgl.getUniformLocation(bp, 'inv');
function frame(mode, t) {
  for (const s of sources) { s.gl.uniform1f(s.t, t); s.gl.drawArrays(s.gl.TRIANGLE_STRIP, 0, 4); }
  if (mode === 'gl-only') {
    ogl.useProgram(op2); ogl.viewport(0, 0, W, H); ogl.clearColor(0, 0, 0, 1); ogl.clear(ogl.COLOR_BUFFER_BIT); ogl.enable(ogl.SCISSOR_TEST);
    for (let i = 0; i < N; i++) {
      const b = box(i); ogl.scissor(b.x, H - b.y - b.h, b.w, b.h); ogl.viewport(b.x, H - b.y - b.h, b.w, b.h);
      ogl.bindTexture(ogl.TEXTURE_2D, otexs[i]); ogl.texImage2D(ogl.TEXTURE_2D, 0, ogl.RGBA, ogl.RGBA, ogl.UNSIGNED_BYTE, sources[i].c);
      ogl.uniformMatrix3fv(inv2, false, INV); ogl.drawArrays(ogl.TRIANGLE_STRIP, 0, 4);
    }
    ogl.disable(ogl.SCISSOR_TEST); sync(ogl); ogl.useProgram(op); return;
  }
  if (mode === 'batched') {
    bgl.viewport(0, 0, W, H); bgl.clearColor(0, 0, 0, 0); bgl.clear(bgl.COLOR_BUFFER_BIT);
    for (let i = 0; i < N; i++) {
      const b = box(i); bgl.viewport(b.x, H - b.y - b.h, b.w, b.h);
      bgl.bindTexture(bgl.TEXTURE_2D, btexs[i]); bgl.texImage2D(bgl.TEXTURE_2D, 0, bgl.RGBA, bgl.RGBA, bgl.UNSIGNED_BYTE, sources[i].c);
      bgl.uniformMatrix3fv(binv, false, INV); bgl.drawArrays(bgl.TRIANGLE_STRIP, 0, 4);
    }
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.drawImage(bigWarp, 0, 0);
    const px = ctx.getImageData(0, 0, 1, 1); return;
  }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < N; i++) {
    const b = box(i);
    if (mode === 'today') { ctx.drawImage(sources[i].c, b.x, b.y, b.w, b.h); continue; }
    wgl.viewport(0, 0, warp.width, warp.height); wgl.clearColor(0, 0, 0, 0); wgl.clear(wgl.COLOR_BUFFER_BIT);
    wgl.bindTexture(wgl.TEXTURE_2D, texs[i]);
    wgl.texImage2D(wgl.TEXTURE_2D, 0, wgl.RGBA, wgl.RGBA, wgl.UNSIGNED_BYTE, sources[i].c);
    wgl.uniformMatrix3fv(inv, false, INV); wgl.drawArrays(wgl.TRIANGLE_STRIP, 0, 4);
    ctx.save(); ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip(); ctx.drawImage(warp, b.x, b.y, b.w, b.h); ctx.restore();
  }
  if (mode === 'pin+corners') {
    ogl.viewport(0, 0, W, H);
    ogl.texImage2D(ogl.TEXTURE_2D, 0, ogl.RGBA, ogl.RGBA, ogl.UNSIGNED_BYTE, stage);
    ogl.drawArrays(ogl.TRIANGLE_STRIP, 0, 4);
    sync(ogl);
  } else { const px = ctx.getImageData(0, 0, 1, 1); }
}
const stats = xs => { const s = [...xs].sort((a, b) => a - b); const q = p => s[Math.min(s.length - 1, Math.floor(s.length * p))]; return `median ${q(.5).toFixed(2)} ms · p95 ${q(.95).toFixed(2)} ms · max ${s.at(-1).toFixed(2)} ms`; };
(async () => {
  await quiet(1500);
  const lines = [];
  for (const mode of ['today', 'pin', 'batched', 'pin+corners', 'gl-only', 'today']) {
    const work = []; let t = 0;
    await new Promise(done => { let n = 0; const tick = () => { const s = performance.now(); frame(mode, t += 1 / 60); work.push(performance.now() - s); if (++n < FRAMES) requestAnimationFrame(tick); else done(); }; requestAnimationFrame(tick); });
    lines.push(`${mode.padEnd(12)} ${stats(work.slice(60))}`);
  }
  spike.done(lines.join('\n'));
})().catch(e => spike.done('ERROR ' + e));
</script>
